# Next to a Jellyfin container: set JELLYFIN_NETWORK to the Docker network Jellyfin is on,
# JELLYFIN_URL to its name there, and DATA_PATH to where the documents should live.
services:
  songsta-sync:
    build: .
    container_name: songsta-sync
    restart: unless-stopped
    environment:
      JELLYFIN_URL: ${JELLYFIN_URL:-http://jellyfin:8096}
    ports:
      - "${SYNC_PORT:-8196}:8196"
    volumes:
      - ${DATA_PATH:-./data}:/data
    networks:
      - jellyfin

networks:
  jellyfin:
    external: true
    name: ${JELLYFIN_NETWORK:-jellyfin}
